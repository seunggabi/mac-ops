name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Get tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Calculate sha256
        id: sha
        run: |
          TARBALL_URL="https://github.com/seunggabi/mac-ops/archive/refs/tags/${{ steps.tag.outputs.version }}.tar.gz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "tarball_url=$TARBALL_URL" >> "$GITHUB_OUTPUT"

      - name: Update homebrew-tap formula
        uses: actions/checkout@v4
        with:
          repository: seunggabi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download and patch tarball
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          # Download original tarball
          curl -sL "${{ steps.sha.outputs.tarball_url }}" -o original.tar.gz

          # Extract, add VERSION file, and repack
          mkdir -p temp
          tar -xzf original.tar.gz -C temp
          echo "$VERSION_NUM" > "temp/mac-ops-${VERSION_NUM}/VERSION"
          cd temp
          tar -czf ../patched.tar.gz "mac-ops-${VERSION_NUM}"
          cd ..

          # Calculate new sha256
          NEW_SHA256=$(shasum -a 256 patched.tar.gz | awk '{print $1}')
          echo "new_sha256=$NEW_SHA256" >> "$GITHUB_OUTPUT"

          # Upload patched tarball as release asset
          gh release upload "$VERSION" patched.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: patch

      - name: Update formula
        run: |
          cd homebrew-tap
          # Use patched tarball URL
          PATCHED_URL="https://github.com/seunggabi/mac-ops/releases/download/${{ steps.tag.outputs.version }}/patched.tar.gz"
          sed -i "s|url \".*\"|url \"$PATCHED_URL\"|" Formula/mac-ops.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.patch.outputs.new_sha256 }}\"|" Formula/mac-ops.rb
          cat Formula/mac-ops.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mac-ops.rb
          git commit -m "chore: bump mac-ops to ${{ steps.tag.outputs.version }}"
          git push

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
